<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Magnata Brasil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky"><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <section id="home" class="screen">
    <div class="card home-card">
      <div id="homePawns" class="pawn-row"></div>
      <div class="logo">Magnata<b>Brasil</b></div>
      <p class="sub">Compre capitais, construa hotéis e leve seus amigos à falência. De 2 a 6 jogadores, online.</p>
      <label>Seu nome <input id="name" maxlength="16" placeholder="Ex.: Henrique" autocomplete="nickname"></label>
      <button id="btnCreate" class="primary big">Criar sala</button>
      <div class="or"><span>ou entre numa sala</span></div>
      <div class="row">
        <input id="code" maxlength="4" placeholder="CÓDIGO" autocomplete="off">
        <button id="btnJoin">Entrar</button>
      </div>
      <p id="homeErr" class="err"></p>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <div class="card lobby-card">
      <p class="eyebrow">Código da sala</p>
      <div id="lobbyCode" class="code"></div>
      <button id="btnCopy">🔗 Copiar link de convite</button>
      <ul id="lobbyPlayers"></ul>
      <p id="lobbyInfo" class="muted"></p>
      <button id="btnStart" class="primary big">Começar partida</button>
      <button id="btnLeave" class="ghost">Sair da sala</button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div id="stage">
      <div id="scene"><div id="board"><div id="center"><div class="logo3d">Magnata<b>Brasil</b></div></div></div></div>
      <div id="overlay"><div id="standing"></div><div id="pawns"></div><div id="floaters"></div></div>
      <div id="hub">
        <div id="dice">
          <div class="die3d"><div class="cube" id="cube1"></div></div>
          <div class="die3d"><div class="cube" id="cube2"></div></div>
        </div>
        <div id="prompt"></div>
      </div>
      <div id="cards"></div>
      <div id="ticker" class="hidden"></div>
      <div id="banner" class="hidden"></div>
      <div id="cardFlip" class="hidden"></div>
      <div id="tools">
        <button data-open="log" title="Histórico">📜</button>
        <button data-open="chat" title="Chat">💬<span id="chatBadge" class="badge hidden"></span></button>
        <button id="btnSound" title="Som">🔊</button>
        <button id="btnQuit" title="Sair da partida">🚪</button>
      </div>
      <div id="drawer" class="hidden">
        <div class="drawer-head">
          <button class="dtab" data-tab="log">Histórico</button>
          <button class="dtab" data-tab="chat">Chat</button>
          <button id="drawerClose" class="x">✕</button>
        </div>
        <div id="log" class="dpanel"></div>
        <div id="chat" class="dpanel">
          <div id="chatMsgs"></div>
          <form id="chatForm"><input id="chatInput" maxlength="200" placeholder="Mandar mensagem…" autocomplete="off"><button>➤</button></form>
        </div>
      </div>
      <div id="gameover" class="hidden"></div>
    </div>
  </section>

  <div id="modal" class="hidden"><div class="modal-box"><div id="modalBody"></div><button id="modalClose" class="ghost">Fechar</button></div></div>
  <div id="toast" class="hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="board-data.js"></script>
  <script src="client.js"></script>
</body>
</html>
