<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magnata Brasil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="home" class="screen">
    <div class="card home-card">
      <div class="logo">Magnata<b>Brasil</b></div>
      <p class="sub">Compre capitais, construa hotéis e leve seus amigos à falência. De 2 a 6 jogadores, online.</p>
      <label>Seu nome <input id="name" maxlength="16" placeholder="Ex.: Henrique" autocomplete="nickname"></label>
      <button id="btnCreate" class="primary big">Criar sala</button>
      <div class="or"><span>ou entre numa sala</span></div>
      <div class="row">
        <input id="code" maxlength="4" placeholder="CÓDIGO" autocomplete="off">
        <button id="btnJoin">Entrar</button>
      </div>
      <p id="homeErr" class="err"></p>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <div class="card lobby-card">
      <p class="eyebrow">Sala</p>
      <div id="lobbyCode" class="code"></div>
      <button id="btnCopy">🔗 Copiar link de convite</button>
      <ul id="lobbyPlayers"></ul>
      <p id="lobbyInfo" class="muted"></p>
      <button id="btnStart" class="primary big">Começar partida</button>
      <button id="btnLeave" class="ghost">Sair da sala</button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div id="boardWrap">
      <div id="board">
        <div id="center">
          <div class="logo small">Magnata<b>Brasil</b></div>
          <div id="dice"><div class="die" id="d1"></div><div class="die" id="d2"></div></div>
          <div id="cardShow" class="hidden"></div>
          <div id="prompt"></div>
          <div id="timer"><div id="timerBar"></div></div>
        </div>
      </div>
    </div>
    <aside id="side">
      <div id="players"></div>
      <div class="tabs">
        <button class="tab active" data-tab="log">Histórico</button>
        <button class="tab" data-tab="chat">Chat <span id="chatBadge" class="badge hidden"></span></button>
      </div>
      <div id="log" class="panel"></div>
      <div id="chat" class="panel hidden">
        <div id="chatMsgs"></div>
        <form id="chatForm"><input id="chatInput" maxlength="200" placeholder="Mandar mensagem…" autocomplete="off"><button>Enviar</button></form>
      </div>
      <button id="btnQuit" class="ghost small">Sair da partida</button>
    </aside>
  </section>

  <div id="modal" class="hidden"><div class="modal-box"><div id="modalBody"></div><button id="modalClose" class="ghost">Fechar</button></div></div>
  <div id="toast" class="hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="board-data.js"></script>
  <script src="client.js"></script>
</body>
</html>
